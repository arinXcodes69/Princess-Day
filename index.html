<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Princess Day · A Digital Gift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--gold:#e9cf9a;--ink:#fff7e8;--bg:#120c1a;--glass:rgba(18,12,26,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;overflow:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;left:0;right:0;bottom:0;padding:0 24px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;transition:opacity .6s}
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:14px 20px 0;text-align:center;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);pointer-events:none}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.dots i{width:18px;height:2px;background:rgba(255,255,255,.3)}.dots i.on{background:var(--gold)}
h1{font-weight:400;font-size:34px;line-height:1.15;margin:0 0 6px;text-shadow:0 2px 16px #000a}
p.sub{font-style:italic;font-size:20px;margin:0 0 16px;opacity:.9;text-shadow:0 2px 12px #000a}
button,.btn{pointer-events:auto;font:600 14px 'Cormorant Garamond',Georgia,serif;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);background:var(--glass);border:1px solid var(--gold);padding:14px 28px;border-radius:2px;cursor:pointer;backdrop-filter:blur(6px)}
.gear{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);pointer-events:auto;padding:6px 10px;letter-spacing:0;font-size:16px;z-index:5}
.sheet{position:fixed;inset:0;background:rgba(10,6,16,.94);z-index:9;display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 22px 30px}
.sheet.on{display:block}.sheet label{display:block;margin:14px 0 4px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.sheet input[type=text],.sheet textarea{width:100%;box-sizing:border-box;background:#fff1;border:1px solid #fff4;color:var(--ink);font:20px 'Cormorant Garamond',Georgia,serif;padding:10px;border-radius:2px}
.sheet textarea{height:110px}.sheet input[type=file]{color:var(--ink);font-size:15px}
#cam video,#cam img.snap{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#cam img.snap{transform:none}
#cam{position:fixed;inset:0;background:#000;z-index:8;display:none}#cam.on{display:block}
#crown{position:absolute;left:50%;top:22%;width:60%;max-width:280px;transform:translate(-50%,0);touch-action:none;cursor:grab;filter:drop-shadow(0 4px 8px #0008)}
#cam .bar{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
#cam .tip{font-style:italic;font-size:18px;margin-bottom:12px;text-shadow:0 1px 8px #000}
.fade{opacity:0}
.hide{visibility:hidden}
#vbar{position:fixed;left:0;right:0;bottom:0;padding:0 20px calc(22px + env(safe-area-inset-bottom,0px));text-align:center;display:none;z-index:4;pointer-events:none}
#vbar.on{display:block}
#vbar .hint{font-style:italic;font-size:17px;margin-bottom:10px;text-shadow:0 1px 8px #000}
#vbar button{margin:0 5px}
#slots>div{border-top:1px solid #fff2;margin-top:10px;padding-top:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><div id="chap">The Arrival · 01 / 05</div><div class="dots" id="dots"></div></div>
<button class="gear" id="gear" aria-label="Customize">✎</button>
<div class="ui" id="ui"><h1 id="t"></h1><p class="sub" id="s"></p><button id="go"></button></div>

<div id="vbar"><div class="hint">Tilt your phone, or drag, to look around</div><div><button id="vPrev" aria-label="Previous photo">&lsaquo;</button><button id="vBack">Back</button><button id="vNext" aria-label="Next photo">&rsaquo;</button></div></div>

<div class="sheet" id="sheet">
  <h1 style="font-size:28px">Make it hers</h1>
  <label>Sushiii</label><input type="text" id="fName">
  <label>Your message (shown in the ballroom)</label><textarea id="fMsg"></textarea>
  <div id="slots"></div>
  <p style="opacity:.7;font-size:15px">Photos and messages are not saved when you close the page. To keep them, put them in the CFG block in the file (photos: image links, captions: text).</p>
  <button id="fDone" style="margin-top:14px">Done</button>
</div>

<div id="cam">
  <video id="vid" playsinline muted autoplay></video>
  <img class="snap" id="snap" style="display:none" alt="">
  <svg id="crown" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg"><g fill="#f3e3b8" stroke="#b89a54" stroke-width="3" stroke-linejoin="round"><path d="M10 105 L20 38 L55 70 L100 12 L145 70 L180 38 L190 105 Z"/><rect x="10" y="98" width="180" height="14" rx="4" fill="#e9cf9a"/></g><g fill="#fff"><circle cx="20" cy="36" r="7"/><circle cx="100" cy="12" r="9"/><circle cx="180" cy="36" r="7"/><circle cx="60" cy="105" r="5"/><circle cx="100" cy="105" r="5"/><circle cx="140" cy="105" r="5"/></g></svg>
  <div class="bar"><div class="tip" id="tip">Drag the crown to fit.</div>
    <button id="shot">Take photo</button> <button id="close">Close</button></div>
</div>

function tex(w, h, fn) { var c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); var t = new T.CanvasTexture(c); return t; }

// ground (outdoor) + garden
var grassM = M(0x2f4a2e); box(160, .2, 200, 0, -.1, -50, grassM);
var pathM = M(0xcdb99a); box(5, .22, 30, 0, 0, 0, pathM); box(5, .22, 40, 0, 0, -135, pathM);

// palace facade with a door gap
var stone = M(0xb79f86), winT = tex(512, 256, function (g, w, h) {
  g.fillStyle = '#b79f86'; g.fillRect(0, 0, w, h); g.fillStyle = '#3b2a3a';
  for (var i = 0; i < 8; i++) for (var j = 0; j < 2; j++) { g.fillRect(14 + i * 62, 24 + j * 110, 34, 70); }
  g.fillStyle = '#ffd98a'; for (i = 0; i < 8; i++) g.fillRect(18 + i * 62, 28, 26, 28);
});
var fm = M(0xffffff, {map: winT});
box(18, 12, 3, -10.6, 6, -31, fm); box(18, 12, 3, 10.6, 6, -31, fm); box(3.2, 7, 3, 0, 8.5, -31, stone);
box(60, 6, 2, 0, 3, -33, stone);
var gold = M(0xc9a35e, {metalness: .6, roughness: .35});
var dL = new T.Group(), dR = new T.Group(); dL.position.set(-1.5, 0, -29.5); dR.position.set(1.5, 0, -29.5);
var doorM = M(0x6d4a2c);
var l = new T.Mesh(new T.BoxGeometry(1.5, 5, .18), doorM); l.position.set(.75, 2.5, 0); dL.add(l);
var r = new T.Mesh(new T.BoxGeometry(1.5, 5, .18), doorM); r.position.set(-.75, 2.5, 0); dR.add(r);

for (var i = -3; i <= 3; i += 6) box(.5, 12, .5, i * 3.6, 6, -29, gold);

box(6, .2, 40, 0, 0, -50, floor); box(14, .2, 32, 0, 0, -86, floor);
box(.3, 6, 40, -3, 3, -50, wall); box(.3, 6, 40, 3, 3, -50, wall);
box(.3, 7, 32, -7, 3.5, -86, M(0xe8d9bd)); box(.3, 7, 32, 7, 3.5, -86, M(0xe8d9bd));
box(6, .2, 40, 0, 6, -50, ceil); box(14, .2, 32, 0, 7, -86, ceil);

var chl = M(0xffe7a8, {emissive: 0xffd27a, emissiveIntensity: .8});
[-42, -56, -80, -94].forEach(function (z) {
  var p = new T.PointLight(0xffd9a0, 1.1, 24); p.position.set(0, 5, z); sc.add(p);
  var s = new T.Mesh(new T.SphereGeometry(.35, 12, 12), chl); s.position.set(0, 5.2, z); sc.add(s);
});

// frames
var frames = [], caps = [];
function ph(i) { return tex(256, 320, function (g, w, h) { var gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#d9b8c8'); gr.addColorStop(1, '#8f6a8a'); g.fillStyle = gr; g.fillRect(0, 0, w, h); g.fillStyle = '#fffd'; g.font = 'italic 28px Georgia'; g.textAlign = 'center'; g.fillText('Add a photo', w / 2, h / 2 - 6); g.font = '22px Georgia'; g.fillText('tap ✎ · memory ' + (i + 1), w / 2, h / 2 + 26); }); }
for (i = 0; i < 6; i++) {
  var side = i % 2 ? 1 : -1, z = -38 - Math.floor(i / 2) * 9;
  box(.12, 2.9, 2.4, side * 2.82, 2.9, z, gold);
  var pm = new T.Mesh(new T.PlaneGeometry(1.9, 2.4), new T.MeshBasicMaterial({map: ph(i)}));

}

// plaque
var plaque = new T.Mesh(new T.PlaneGeometry(4.2, 2.6), new T.MeshBasicMaterial());
plaque.position.set(0, 2.3, -88); sc.add(plaque);
box(4.5, 2.9, .12, 0, 2.3, -88.1, M(0x1b1320)); box(.15, 1.2, .15, 0, .6, -88, gold);
function drawPlaque() {
  plaque.material.map = tex(840, 520, function (g, w, h) {
    g.fillStyle = '#1b1320'; g.fillRect(0, 0, w, h); g.strokeStyle = '#e9cf9a'; g.strokeRect(14, 14, w - 28, h - 28);
    g.fillStyle = '#fff3d8'; g.textAlign = 'center'; g.font = 'italic 34px Georgia';
    var lines = []; CFG.message.split('\n').forEach(function (p) {
      var cur = ''; p.split(' ').forEach(function (wd) { var t = cur ? cur + ' ' + wd : wd; if (g.measureText(t).width > 700) { lines.push(cur); cur = wd; } else cur = t; }); lines.push(cur);
    });

  }); plaque.material.needsUpdate = true;
}

// garden: hedges, roses, pavilion, crown pedestal
var hedge = M(0x1f4a2a), rose = M(0xc2223a);
for (i = 0; i < 12; i++) { var z = -104 - i * 5; [-1, 1].forEach(function (s) {
  box(2, 1.4, 4, s * 4.2, .7, z, hedge);
  for (var k = 0; k < 4; k++) { var b = new T.Mesh(new T.SphereGeometry(.2, 8, 8), rose); b.position.set(s * (3.3 + Math.random() * 1.8), .9 + Math.random() * .6, z + Math.random() * 3 - 1.5); sc.add(b); }
}); }
var cw = M(0xf1e6d2);
var pav = new T.Group(); pav.position.set(0, 0, -150);
for (i = 0; i < 8; i++) { var a = i / 8 * Math.PI * 2; var c = new T.Mesh(new T.CylinderGeometry(.35, .4, 6, 12), cw); c.position.set(Math.cos(a) * 4, 3, Math.sin(a) * 4); pav.add(c); }
var dome = new T.Mesh(new T.SphereGeometry(4.6, 24, 12, 0, 7, 0, 1.5), cw); dome.position.y = 6; pav.add(dome);
var rim = new T.Mesh(new T.CylinderGeometry(4.6, 4.6, .5, 24), cw); rim.position.y = 6; pav.add(rim); sc.add(pav);
var ped = new T.Mesh(new T.CylinderGeometry(.8, 1, 1.4, 20), cw); ped.position.set(0, .7, -125); sc.add(ped);
var crownG = new T.Group(); crownG.position.set(0, 1.9, -125);
var band = new T.Mesh(new T.TorusGeometry(.5, .08, 8, 24), gold); band.rotation.x = Math.PI / 2; crownG.add(band);
for (i = 0; i < 7; i++) { var a2 = i / 7 * Math.PI * 2; var cn = new T.Mesh(new T.ConeGeometry(.1, .45, 6), gold); cn.position.set(Math.cos(a2) * .5, .25, Math.sin(a2) * .5); crownG.add(cn); }
sc.add(crownG); var cl = new T.PointLight(0xfff0c0, 1.2, 10); cl.position.set(0, 3, -123); sc.add(cl);

// stops
var STOPS = [
  {z: 8, ch: 'The Arrival', t: 'A palace, made for you.', s: '', b: 'Walk in', bg: 0x3a2a4a},
  {z: -22, ch: 'The Grand Entrance', t: 'The doors are waiting for you.', s: '', b: 'Open the doors', bg: 0x3a2a4a, doors: 1},
  {z: -34, ch: 'The Royal Gallery', t: 'Every memory, framed.', s: 'Tap a photo to look closer.', b: 'Continue', bg: 0x1d1220},
  {z: -80, ch: 'The Grand Ballroom', t: '', s: '', b: 'Step outside', bg: 0x1d1220},
  {z: -122, ch: 'The Rose Garden', t: 'Your very own crown.', s: '', b: 'Claim your crown', bg: 0x7a4a5a, crown: 1},
  {z: -140, ch: 'The Courtyard', t: '', s: 'Happy Princess Day', b: 'Wear your crown again.', bg: 0x8a5a60, end: 1}
];
var cur = -1, moving = false, bgFrom = new T.Color(0x3a2a4a), bgTo = new T.Color(0x3a2a4a), bgK = 1, doorK = 0, doorT = 0;
sc.background = new T.Color(0x3a2a4a); sc.fog = new T.Fog(0x3a2a4a, 18, 70);
var dots = document.getElementById('dots'); for (i = 0; i < 5; i++) dots.appendChild(document.createElement('i'));
var $ = function (id) { return document.getElementById(id); };

function setText(k) {
  var st = STOPS[k]; $('ui').classList.remove('fade');
  var n = CFG.name || 'Princess';
  $('t').textContent = st.end ? 'Princess ' + n.replace(/^Princess\s+/i, '') + '.' : st.t;
  $('s').textContent = st.s; $('go').textContent = st.b;
  $('chap').textContent = st.ch + ' · 0' + Math.min(k + 1, 5) + ' / 05';
  [].forEach.call(dots.children, function (d, j) { d.className = j <= Math.min(k, 4) ? 'on' : ''; });
}
function goto(k) {
  if (moving) return; moving = true; $('ui').classList.add('fade');
  var z0 = camZ, z1 = STOPS[k].z, t0 = performance.now(), dur = k === 0 ? 1 : 3200;
  bgFrom.copy(sc.background); bgTo.set(STOPS[k].bg); bgK = 0;
  if (STOPS[k].doors) doorT = 0;
  (function step(now) {
    var u = Math.min(1, (now - t0) / dur), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    camZ = z0 + (z1 - z0) * e; bgK = e; cur = k;
    if (u < 1) requestAnimationFrame(step); else { moving = false; setText(k); if (k === 3) { $('t').textContent = 'A note, just for you.'; $('s').textContent = ''; } }
  })(t0);
}
$('go').onclick = function () {
  if (moving) return; var st = STOPS[cur];
  if (st.doors && doorK < 1) { doorT = 1; $('go').textContent = 'Walk in'; setTimeout(function () { cur = 1; doorK = 1; goto(2); }, 1400); $('ui').classList.add('fade'); return; }
  if (st.crown) { openCam(); return; }
  if (st.end) { openCam(); return; }
  goto(cur + 1);
};

// render loop
var clock = 0;
var view = false, vi = 0, vk = 0, vSnap = false, oriLive = false, base = null;
var vpos = new T.Vector3(), vlook = new T.Vector3(), tilt = {x: 0, y: 0}, tgt = {x: 0, y: 0};
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function openView(i) {
  if (moving || cur !== 2) return;
  if (!view) {
    vSnap = vk < .02; base = null; tgt.x = tgt.y = tilt.x = tilt.y = 0;
    try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(function () {}); } catch (e) {}
  }
  view = true; vi = i;
  $('ui').classList.add('hide'); document.querySelector('.top').classList.add('hide'); $('vbar').classList.add('on');
}
function closeView() { view = false; $('ui').classList.remove('hide'); document.querySelector('.top').classList.remove('hide'); $('vbar').classList.remove('on'); }
$('vBack').onclick = closeView;
$('vPrev').onclick = function () { vi = (vi + 5) % 6; base = null; };
$('vNext').onclick = function () { vi = (vi + 1) % 6; base = null; };
addEventListener('deviceorientation', function (e) {
  if (e.gamma == null || e.beta == null) return; oriLive = true;
  if (!view) return; if (!base) base = {g: e.gamma, b: e.beta};
  tgt.x = clamp((e.gamma - base.g) / 20, -1, 1); tgt.y = clamp((e.beta - base.b) / 20, -1, 1);
});
addEventListener('pointermove', function (e) {
  if (!view || oriLive) return;
  tgt.x = (e.clientX / innerWidth - .5) * 2; tgt.y = -(e.clientY / innerHeight - .5) * 2;
});
var rc = new T.Raycaster(), mv = new T.Vector2(), downP = null;
cv.addEventListener('pointerdown', function (e) { downP = {x: e.clientX, y: e.clientY}; });
cv.addEventListener('click', function (e) {
  if (view || moving || cur !== 2) return;
  if (downP && Math.hypot(e.clientX - downP.x, e.clientY - downP.y) > 10) return;
  mv.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); rc.setFromCamera(mv, cam);
  var hit = rc.intersectObjects(frames.concat(caps))[0]; if (!hit) return;
  var k = frames.indexOf(hit.object); if (k < 0) k = caps.indexOf(hit.object);
  if (k >= 0) openView(k);
});
(function loop(now) {
  requestAnimationFrame(loop);
  if (doorT) { doorK = Math.min(1, doorK + .012); dL.rotation.y = doorK * 1.5; dR.rotation.y = -doorK * 1.5; }
  sc.background.lerpColors(bgFrom, bgTo, bgK); sc.fog.color.copy(sc.background);
  crownG.rotation.y = now / 1200; crownG.position.y = 1.9 + Math.sin(now / 700) * .08;
  var nx = Math.sin(now / 2200) * .12, ny = 1.7 + Math.sin(now / 1500) * .04;
  tilt.x += (tgt.x - tilt.x) * .12; tilt.y += (tgt.y - tilt.y) * .12;
  vk += ((view ? 1 : 0) - vk) * .08; if (!view && vk < .002) vk = 0;
  var np = new T.Vector3(nx, ny, camZ), nl = new T.Vector3(0, 1.9, camZ - 10);
  if (view || vk > 0) {
    var fr = frames[vi].userData, d = clamp(1.5 / cam.aspect, 2.6, 5.2);
    var vp = new T.Vector3(fr.side * (2.74 - d), 2.7 + tilt.y * .3, fr.z + fr.side * tilt.x * .3);
    var vl = new T.Vector3(fr.side * 2.74, 2.7 + tilt.y * .8, fr.z + fr.side * tilt.x * .8);
    if (vSnap) { vpos.copy(vp); vlook.copy(vl); vSnap = false; } else { vpos.lerp(vp, .1); vlook.lerp(vl, .1); }
    np.lerp(vpos, vk); nl.lerp(vlook, vk);
  }
  cam.position.copy(np); cam.lookAt(nl);
  
  R.render(sc, cam);
})(0);
addEventListener('resize', function () { W = innerWidth; H = innerHeight; R.setSize(W, H); cam.aspect = W / H; cam.updateProjectionMatrix(); });

// customize
$('gear').onclick = function () { $('fName').value = CFG.name; $('fMsg').value = CFG.message; $('sheet').classList.add('on'); };
$('fDone').onclick = function () { CFG.name = $('fName').value; CFG.message = $('fMsg').value; drawPlaque(); setText(cur < 0 ? 0 : cur); $('sheet').classList.remove('on'); };
function drawCaption(i) {
  var txt = (CFG.captions && CFG.captions[i]) || '';
  caps[i].visible = !!txt; if (!txt) return;
  caps[i].material.map = tex(760, 200, function (g, w, h) {
    g.fillStyle = '#1b1320'; g.fillRect(0, 0, w, h); g.strokeStyle = '#e9cf9a'; g.lineWidth = 3; g.strokeRect(8, 8, w - 16, h - 16);
    g.fillStyle = '#fff3d8'; g.textAlign = 'center'; g.font = 'italic 38px Georgia';
    var ls = [], ln = ''; txt.split(' ').forEach(function (wd) { var t2 = ln ? ln + ' ' + wd : wd; if (g.measureText(t2).width > 680 && ln) { ls.push(ln); ln = wd; } else ln = t2; }); ls.push(ln);
    ls = ls.slice(0, 3); var y0 = h / 2 - (ls.length - 1) * 23 + 12; ls.forEach(function (s, k) { g.fillText(s, w / 2, y0 + k * 46); });
  });
  caps[i].material.needsUpdate = true;
}
function setPhoto(i, src) {
  var im = new Image(); im.crossOrigin = 'anonymous';
  im.onload = function () {
    var m = frames[i].material;
    m.map = tex(512, 640, function (g, w, h) { var s = Math.max(w / im.width, h / im.height); g.drawImage(im, (w - im.width * s) / 2, (h - im.height * s) / 2, im.width * s, im.height * s); });
    m.needsUpdate = true;
  };
  im.src = src;
}
(function () {
  var box = $('slots');
  for (var k = 0; k < 6; k++) (function (k) {
    var d = document.createElement('div');
    d.innerHTML = '<label>Photo ' + (k + 1) + '</label><input type="file" accept="image/*"><input type="text" maxlength="80" placeholder="Small message under this photo" style="margin-top:8px">';
    var fi = d.children[1], ti = d.children[2]; ti.value = CFG.captions[k] || '';
    fi.onchange = function () { if (fi.files[0]) setPhoto(k, URL.createObjectURL(fi.files[0])); };
    ti.oninput = function () { CFG.captions[k] = ti.value; drawCaption(k); };
    box.appendChild(d);
  })(k);
})();

// crown try-on
var stream = null, cr = $('crown'), drag = null;
function openCam() {
  $('cam').classList.add('on'); $('snap').style.display = 'none'; $('vid').style.display = 'block';
  navigator.mediaDevices && navigator.mediaDevices.getUserMedia({video: {facingMode: 'user'}}).then(function (s) { stream = s; $('vid').srcObject = s; $('tip').textContent = 'Fit your face in the frame. Drag the crown to adjust.'; })
  .catch(function () { $('tip').textContent = 'Camera is unavailable here. Open the page in your browser to try the crown on.'; });
}
cr.onpointerdown = function (e) { drag = {x: e.clientX - cr.offsetLeft, y: e.clientY - cr.offsetTop}; cr.setPointerCapture(e.pointerId); };
cr.onpointermove = function (e) { if (drag) { cr.style.left = (e.clientX - drag.x) + 'px'; cr.style.top = (e.clientY - drag.y) + 'px'; cr.style.transform = 'none'; } };
cr.onpointerup = function () { drag = null; };
$('close').onclick = function () {
  $('cam').classList.remove('on'); if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null;
  if (STOPS[cur].crown) goto(5);
};
$('shot').onclick = function () {
  var v = $('vid'); if (!v.videoWidth) return;
  var c = document.createElement('canvas'), k = innerWidth / innerHeight, vw = v.videoWidth, vh = v.videoHeight, sw = vw, sh = vw / k; if (sh > vh) { sh = vh; sw = vh * k; }
  c.width = 720; c.height = 720 / k; var g = c.getContext('2d');
  g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(v, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, c.width, c.height); g.setTransform(1, 0, 0, 1, 0, 0);
  var sx = c.width / innerWidth, cb = cr.getBoundingClientRect(), svg = new XMLSerializer().serializeToString(cr), im = new Image();
  im.onload = function () {
    g.drawImage(im, cb.left * sx, cb.top * sx, cb.width * sx, cb.height * sx);
    g.fillStyle = '#fff'; g.font = 'italic ' + 26 * sx + 'px Georgia'; g.textAlign = 'center'; g.fillText('Happy Princess Day', c.width / 2, c.height - 30 * sx);
    var a = document.createElement('a'); a.href = c.toDataURL('image/jpeg', .92); a.download = 'princess.jpg'; $('snap').src = a.href; $('snap').style.display = 'block'; $('vid').style.display = 'none'; $('tip').textContent = 'Press and hold the photo to save it.'; try { a.click(); } catch (e) {}
  };
  im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
};

drawPlaque();
for (var q = 0; q < 6; q++) { drawCaption(q); if (CFG.photos && CFG.photos[q]) setPhoto(q, CFG.photos[q]); }
goto(0);
</script>
